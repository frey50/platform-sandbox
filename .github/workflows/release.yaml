name: Release CLI

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # cmd/platformctl is its own Go module — build from inside it.
          # (Building ./cmd/platformctl/main.go from the repo root breaks
          #  because the nested module is invisible to the root module.)
          go-version-file: cmd/platformctl/go.mod

      - name: Build binaries
        working-directory: cmd/platformctl
        run: |
          mkdir -p ../../dist
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../dist/platformctl-linux-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../../dist/platformctl-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../dist/platformctl-windows-amd64.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/platformctl-linux-amd64
            dist/platformctl-darwin-arm64
            dist/platformctl-windows-amd64.exe