name: Release CLI

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binaries
        run: |
          mkdir -p dist
          # Build for Linux
          GOOS=linux GOARCH=amd64 go build -o dist/platformctl-linux-amd64 ./cmd/platformctl/main.go
          # Build for macOS
          GOOS=darwin GOARCH=arm64 go build -o dist/platformctl-darwin-arm64 ./cmd/platformctl/main.go
          # Build for Windows
          GOOS=windows GOARCH=amd64 go build -o dist/platformctl-windows-amd64.exe ./cmd/platformctl/main.go

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/platformctl-linux-amd64
            dist/platformctl-darwin-arm64
            dist/platformctl-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}