name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Manifests & Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: sudo apt-get install -y yamllint

      - name: Lint YAML
        run: yamllint .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go Lint
        run: |
          # If you don't have code yet, this will just pass. 
          # Otherwise, it ensures your CLI is clean.
          go vet ./cmd/platformctl/...

  integration-test:
    name: K8s Integration Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: platform-sandbox
          config: |
            kind: Cluster
            apiVersion: kind.x-k8s.io/v1alpha4
            nodes:
            - role: control-plane

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=180s

      - name: Apply Platform Manifests
        run: |
          # Apply the downscaler and the app application
          kubectl apply -f apps/sample-app-application.yaml -n argocd
          
          # Wait for the sample-app namespace to be created by Argo CD
          ATTEMPTS=0
          until kubectl get ns sample-app || [ $ATTEMPTS -eq 10 ]; do
            sleep 5
            ATTEMPTS=$((ATTEMPTS+1))
          done
          
          # Verify pods eventually come up
          kubectl wait --for=condition=ready pod --all -n sample-app --timeout=120s

  build-cli:
    name: Build platformctl
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build CLI
        run: |
          mkdir -p bin
          go build -v -o bin/platformctl ./cmd/platformctl/main.go