name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint & Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run yamllint
        run: |
          sudo apt-get install -y yamllint
          yamllint -c .yamllint .

      - name: Kustomize build check
        # Catches broken kustomization.yaml references before schema validation
        run: kubectl kustomize apps/sample-app > /dev/null

      - name: Kubernetes Schema Validation (kubeconform)
        # - kustomization.yaml is NOT a Kubernetes resource -> excluded
        # - Helm values files -> excluded
        # - CRDs (Argo CD Application, Prometheus ServiceMonitor) are validated
        #   against the datreeio CRDs catalog instead of failing with
        #   "could not find schema"
        run: |
          VERSION="v0.6.4"
          curl -sL https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -summary \
            -ignore-filename-pattern ".*values.*" \
            -ignore-filename-pattern "kustomization.yaml" \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            apps/ infrastructure/

  go-build:
    name: Build & Vet CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/platformctl/go.mod

      - name: Vet, test, and build
        working-directory: cmd/platformctl
        run: |
          go vet ./...
          go test ./...
          go build -o /tmp/platformctl .

      - name: Smoke test CLI
        run: /tmp/platformctl --help

  integration-test:
    name: K8s Integration Test
    needs: [validate, go-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: platform-sandbox

      - name: Install Prometheus CRDs
        # servicemonitor.yaml cannot be applied without these
        run: |
          kubectl apply -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=300s

      - name: Apply manifests from THIS commit
        # Tests the current commit deterministically via kustomize.
        # (Argo CD repo-server runs inside the cluster and cannot see the
        #  runner filesystem, so we apply directly here.)
        run: |
          kubectl apply -k apps/sample-app

          kubectl apply -f infrastructure/downscaler/namespace.yaml
          kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/kube-downscaler --timeout=30s

          kubectl apply -f infrastructure/downscaler/

      - name: Verify workloads come up
        run: |
          kubectl -n sample-app rollout status deployment/sample-app --timeout=180s
          kubectl -n kube-downscaler rollout status deployment/kube-downscaler --timeout=180s
          kubectl get pods -A

      - name: Register app with Argo CD (GitOps smoke test)
        # Applies the real Application (points at GitHub main) and confirms
        # Argo CD can reconcile it.
        run: |
          kubectl apply -n argocd -f apps/sample-app/sample-app-application.yaml
          sleep 15
          kubectl -n argocd get application sample-app