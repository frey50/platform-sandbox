name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint & Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-fix End of Files
        # A thoughtful step: fix the files before the linter sees them
        run: |
          find . -type f -name "*.yaml" -exec sh -c "tail -c1 {} | read -r _ || echo >> {}" \;

      - name: Run yamllint
        run: |
          sudo apt-get install -y yamllint
          yamllint -c .yamllint .

      - name: Kubernetes Schema Validation (kubeconform)
        # Smart move: check if the K8s manifests are actually valid K8s objects
        run: |
          VERSION="v0.6.4"
          curl -L https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -summary -ignore-filename-pattern ".*values.*" apps/ infrastructure/

  integration-test:
    name: K8s Integration Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: platform-sandbox

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=180s

      - name: Prepare Local Sync
        # THE SMART BIT: Point the Application manifest to the local files 
        # so Argo CD tests the CURRENT commit, not the remote one.
        run: |
          sed -i 's|repoURL: .*|repoURL: /github/workspace|' apps/sample-app/sample-app-application.yaml

      - name: Apply & Verify
        run: |
          kubectl apply -f apps/sample-app/sample-app-application.yaml -n argocd
          
          echo "Waiting for Argo CD to reconcile..."
          # We check for the namespace creation as a sign of progress
          for i in {1..20}; do
            kubectl get ns sample-app && break || sleep 5
          done
          
          kubectl get pods -A