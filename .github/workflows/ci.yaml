name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Manifests & Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: sudo apt-get install -y yamllint

      - name: Lint YAML
        # Using | to prevent IDE syntax highlighting errors
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go Lint
        run: |
          # Only run if go.mod exists
          if [ -f go.mod ]; then
            go vet ./...
          else
            echo "No go.mod found, skipping go vet"
          fi

  integration-test:
    name: K8s Integration Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: platform-sandbox

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=180s

      - name: Apply Platform Manifests
        run: |
          # FIXED PATH: Added /sample-app/ to the path
          kubectl apply -f apps/sample-app/sample-app-application.yaml -n argocd
          
          echo "Waiting for Argo CD to create the namespace..."
          ATTEMPTS=0
          until kubectl get ns sample-app || [ $ATTEMPTS -eq 20 ]; do
            sleep 5
            ATTEMPTS=$((ATTEMPTS+1))
          done
          
          # Check if the pods actually start
          kubectl get pods -A

  build-cli:
    name: Build platformctl
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build CLI
        run: |
          if [ -f cmd/platformctl/main.go ]; then
            mkdir -p bin
            go build -v -o bin/platformctl ./cmd/platformctl/main.go
          else
            echo "CLI source not found, skipping build"
          fi