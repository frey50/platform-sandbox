name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint & Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run yamllint
        run: |
          sudo apt-get install -y yamllint
          yamllint -c .yamllint .

      - name: Kustomize build check
        run: |
          kubectl kustomize apps/sample-app > /dev/null
          kubectl kustomize infrastructure/observability > /dev/null

      - name: Kubernetes Schema Validation (kubeconform)
        run: |
          VERSION="v0.6.4"
          curl -sL https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -summary \
            -ignore-filename-pattern ".*values.*" \
            -ignore-filename-pattern "kustomization.yaml" \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            apps/ infrastructure/

  go-build:
    name: Build & Vet CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/platformctl/go.mod

      - name: Vet, test, and build
        working-directory: cmd/platformctl
        run: |
          go vet ./...
          go test ./...
          go build -o /tmp/platformctl .

      - name: Smoke test CLI
        run: /tmp/platformctl --help

  integration-test:
    name: K8s Integration Test
    needs: [validate, go-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: platform-sandbox

      - name: Install Prometheus CRDs
        run: |
          kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml
          kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml
          kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_prometheuses.yaml
          kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=300s

      - name: Apply manifests from THIS commit
        run: |
          kubectl apply -k apps/sample-app
          kubectl apply -f infrastructure/downscaler/namespace.yaml
          kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/kube-downscaler --timeout=30s
          kubectl apply -f infrastructure/downscaler/

      - name: Verify workloads come up
        run: |
          kubectl -n sample-app rollout status deployment/sample-app --timeout=180s
          kubectl -n kube-downscaler rollout status deployment/kube-downscaler --timeout=180s
          kubectl get pods -A

      - name: Register app with Argo CD (GitOps smoke test)
        run: |
          kubectl apply -n argocd -f apps/sample-app/sample-app-application.yaml
          sleep 15
          kubectl -n argocd get application sample-app

      - name: Debug workloads on failure
        if: failure()
        run: |
          echo "=== sample-app pods ==="
          kubectl -n sample-app get pods -o wide
          echo "=== sample-app describe ==="
          kubectl -n sample-app describe pods -l app.kubernetes.io/name=sample-app
          echo "=== sample-app logs ==="
          kubectl -n sample-app logs -l app.kubernetes.io/name=sample-app --all-containers --tail=100 || true
          echo "=== kube-downscaler pods ==="
          kubectl -n kube-downscaler get pods -o wide
          echo "=== kube-downscaler describe ==="
          kubectl -n kube-downscaler describe pods -l app.kubernetes.io/name=kube-downscaler
          echo "=== kube-downscaler logs ==="
          kubectl -n kube-downscaler logs -l app.kubernetes.io/name=kube-downscaler --all-containers --tail=100 || true

  observability-test:
    name: Observability Stack Test
    needs: [validate, go-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: platform-sandbox

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install Prometheus CRDs
        run: |
          kubectl apply --server-side --force-conflicts \
            -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml
          kubectl apply --server-side --force-conflicts \
            -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml
          kubectl apply --server-side --force-conflicts \
            -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_prometheuses.yaml
          kubectl apply --server-side --force-conflicts \
            -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml

      - name: Install kube-prometheus-stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install platform prometheus-community/kube-prometheus-stack \
            --namespace observability --create-namespace \
            --version 56.0.0 \
            --skip-crds \
            --timeout 20m \
            --wait \
            --wait-for-jobs \
            --values infrastructure/observability/kube-prometheus-stack-values.yaml

      - name: Apply observability plain manifests
        run: |
          kubectl apply -k infrastructure/observability

      - name: Verify observability workloads
        run: |
          kubectl -n observability rollout status deployment/platform-grafana --timeout=300s
          kubectl -n observability rollout status deployment/platform-kube-state-metrics --timeout=300s
          kubectl -n observability rollout status deployment/loki --timeout=300s
          kubectl -n observability rollout status daemonset/promtail --timeout=300s
          kubectl get pods -n observability

      - name: Verify Grafana dashboard ConfigMap is loaded
        run: |
          kubectl -n observability get configmap platform-sandbox-dashboards -o yaml | grep "platform-sandbox-overview"

      - name: Smoke test Prometheus query endpoint
        run: |
          kubectl port-forward svc/platform-prometheus 9090:9090 -n observability &
          sleep 5
          curl -sf http://localhost:9090/api/v1/query?query=up || echo "Prometheus not ready yet (expected in CI)"
          kill %1 || true

      - name: Debug observability on failure
        if: failure()
        run: |
          echo "=== All pods ==="
          kubectl get pods -A
          echo "=== Pending pods (resource pressure?) ==="
          kubectl get pods -A --field-selector=status.phase=Pending
          echo "=== Observability events ==="
          kubectl -n observability get events --sort-by='.lastTimestamp' | tail -30
          echo "=== Node resources ==="
          kubectl describe node | grep -A 5 "Allocated resources"
          echo "=== Grafana logs ==="
          kubectl -n observability logs -l app.kubernetes.io/name=grafana --tail=100 || true
          echo "=== Prometheus logs ==="
          kubectl -n observability logs -l app.kubernetes.io/name=prometheus --tail=100 || true
          echo "=== Loki logs ==="
          kubectl -n observability logs -l app.kubernetes.io/name=loki --tail=100 || true
          echo "=== Promtail logs ==="
          kubectl -n observability logs -l app.kubernetes.io/name=promtail --tail=100 || true

  cli-e2e-test:
    name: platformctl up E2E Test
    needs: [validate, go-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/platformctl/go.mod

      - name: Build platformctl
        working-directory: cmd/platformctl
        run: go build -o /tmp/platformctl .

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: platform-sandbox

      - name: Install Prometheus CRDs
        run: kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== all pods ==="
          kubectl get pods -A
          echo "=== argocd application ==="
          kubectl -n argocd get application sample-app -o yaml || true
          echo "=== sample-app describe ==="
          kubectl -n sample-app describe pods -l app.kubernetes.io/name=sample-app || true
          echo "=== sample-app logs ==="
          kubectl -n sample-app logs -l app.kubernetes.io/name=sample-app --all-containers --tail=100 || true