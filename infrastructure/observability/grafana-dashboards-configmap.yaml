apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-sandbox-dashboards
  namespace: observability
  labels:
    app.kubernetes.io/part-of: platform-sandbox
    grafana_dashboard: "1"
    grafana_folder: Platform Sandbox
data:
  platform-sandbox-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"},
            "enable": true,
            "expr": "changes(kube_deployment_status_replicas{deployment=\"sample-app\"}[5m]) > 0",
            "iconColor": "red",
            "name": "Replica Changes",
            "tagKeys": "deployment",
            "textFormat": "Replicas changed for {{deployment}}",
            "titleFormat": "Scale Event"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["platform-sandbox", "cost-optimization", "gitops"],
      "templating": {
        "list": [
          {
            "current": {"selected": false, "text": "sample-app", "value": "sample-app"},
            "hide": 0,
            "includeAll": false,
            "label": "Namespace",
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": "label_values(kube_namespace_labels, namespace)",
            "refresh": 1,
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"}
          },
          {
            "current": {"selected": false, "text": "sample-app", "value": "sample-app"},
            "hide": 0,
            "includeAll": false,
            "label": "Deployment",
            "multi": false,
            "name": "deployment",
            "options": [],
            "query": "label_values(kube_deployment_status_replicas{namespace=~\"$namespace\"}, deployment)",
            "refresh": 1,
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"}
          },
          {
            "current": {"selected": false, "text": "Prometheus", "value": "Prometheus"},
            "hide": 0,
            "includeAll": false,
            "label": "Datasource",
            "multi": false,
            "name": "prometheus_datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "utc",
      "title": "Platform Sandbox Overview",
      "uid": "platform-sandbox-overview",
      "version": 1,
      "weekStart": "",
      "panels": [
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "panels": [],
          "title": "🩺 Platform Health",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "value"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 1}, {"color": "green", "value": 2}]},
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {"h": 3, "w": 4, "x": 0, "y": 1},
          "id": 2,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "pluginVersion": "10.1.0",
          "targets": [{"expr": "kube_deployment_status_replicas{namespace=~\"$namespace\", deployment=~\"$deployment\"}", "refId": "A"}],
          "title": "Current Replicas",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "value"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 1}, {"color": "green", "value": 2}]},
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {"h": 3, "w": 4, "x": 4, "y": 1},
          "id": 3,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "pluginVersion": "10.1.0",
          "targets": [{"expr": "kube_deployment_spec_replicas{namespace=~\"$namespace\", deployment=~\"$deployment\"}", "refId": "A"}],
          "title": "Desired Replicas",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "value"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 1}, {"color": "green", "value": 2}]},
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {"h": 3, "w": 4, "x": 8, "y": 1},
          "id": 4,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "pluginVersion": "10.1.0",
          "targets": [{"expr": "kube_deployment_status_replicas_available{namespace=~\"$namespace\", deployment=~\"$deployment\"}", "refId": "A"}],
          "title": "Available Replicas",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"},
          "gridPos": {"h": 3, "w": 8, "x": 12, "y": 1},
          "id": 5,
          "options": {"code": {"language": "plaintext", "showLineNumbers": false, "showMiniMap": false}, "content": "**Argo CD Application:** `sample-app`\\n\\nCheck sync status via CLI:\\n```bash\\nkubectl get application sample-app -n argocd\\n```\\n\\nOr use `platformctl status` for a unified view.", "mode": "markdown"},
          "pluginVersion": "10.1.0",
          "targets": [],
          "title": "Argo CD Sync Status",
          "type": "text"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 50}, {"color": "green", "value": 100}]},
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 3, "w": 4, "x": 20, "y": 1},
          "id": 6,
          "options": {"orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "showThresholdLabels": true, "showThresholdMarkers": true},
          "pluginVersion": "10.1.0",
          "targets": [{"expr": "clamp_min((kube_deployment_status_replicas_available{namespace=~\"$namespace\", deployment=~\"$deployment\"} / kube_deployment_spec_replicas{namespace=~\"$namespace\", deployment=~\"$deployment\"}) * 100, 0)", "refId": "A"}],
          "title": "App Health %",
          "type": "gauge"
        },
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 4},
          "id": 7,
          "panels": [],
          "title": "💰 Cost Optimization",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]},
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 5},
          "id": 8,
          "options": {"legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "none"}},
          "pluginVersion": "10.1.0",
          "targets": [{"expr": "kube_deployment_status_replicas{namespace=~\"$namespace\", deployment=~\"$deployment\"}", "legendFormat": "{{deployment}}", "refId": "A"}],
          "title": "Replica Count Over Time",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]},
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 5},
          "id": 9,
          "options": {"legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "none"}},
          "pluginVersion": "10.1.0",
          "targets": [{"expr": "kube_deployment_status_replicas{namespace=~\"$namespace\", deployment=~\"$deployment\"} * 0.05", "legendFormat": "{{deployment}}", "refId": "A"}],
          "title": "Estimated Hourly Cost ($)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "value"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 2}]},
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {"h": 3, "w": 4, "x": 0, "y": 11},
          "id": 10,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "pluginVersion": "10.1.0",
          "targets": [{"expr": "3 - kube_deployment_status_replicas{namespace=~\"$namespace\", deployment=~\"$deployment\"}", "refId": "A"}],
          "title": "Replicas Saved (now)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 30}, {"color": "red", "value": 70}]},
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 3, "w": 4, "x": 4, "y": 11},
          "id": 11,
          "options": {"orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "showThresholdLabels": true, "showThresholdMarkers": true},
          "pluginVersion": "10.1.0",
          "targets": [{"expr": "clamp_min(((3 - kube_deployment_status_replicas{namespace=~\"$namespace\", deployment=~\"$deployment\"}) / 3) * 100, 0)", "refId": "A"}],
          "title": "Cost Savings %",
          "type": "gauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "value"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]},
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "gridPos": {"h": 3, "w": 4, "x": 8, "y": 11},
          "id": 12,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "pluginVersion": "10.1.0",
          "targets": [{"expr": "3 * 24 * 0.05", "refId": "A"}],
          "title": "Est. Daily Baseline ($)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${prometheus_datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "value"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 0.5}, {"color": "green", "value": 1.0}]},
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "gridPos": {"h": 3, "w": 4, "x": 12, "y": 11},
          "id": 13,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "pluginVersion": "10.1.0",
          "targets": [{"expr": "(3 - avg_over_time(kube_deployment_status_replicas{namespace=~\"$namespace\", deployment=~\"$deployment\"}[1d])) * 24 * 0.05", "refId": "A"}],
