apiVersion: batch/v1
kind: CronJob
metadata:
  name: cost-reporter
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/part-of: platform-sandbox
    app.kubernetes.io/component: cost-reporter
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    downscaler/exclude: "true"
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cost-reporter
        spec:
          serviceAccountName: cost-reporter
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          containers:
            - name: reporter
              image: bitnami/kubectl:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/report.sh
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1001
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: cost-reporter-script
                defaultMode: 0755
            - name: tmp
              emptyDir: {}