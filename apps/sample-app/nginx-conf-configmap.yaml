apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-nginx-conf
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/part-of: platform-sandbox
    app.kubernetes.io/component: web
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  hello.conf: |
    server {
        listen       8080 default_server;
        listen       [::]:8080 default_server;
        server_name  _;

        location / {
            default_type text/plain;
            return 200 "Server address: $server_addr:$server_port\nServer name: $hostname\nDate: $time_local\nURI: $request_uri\n";
        }

        location /metrics {
            default_type text/plain;
            return 200 "# sample-app placeholder metrics endpoint\n";
        }
    }