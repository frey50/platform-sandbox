apiVersion: v1
kind: ServiceAccount
metadata:
  name: cost-reporter
  namespace: sample-app
  labels:
    app.kubernetes.io/name: cost-reporter
    app.kubernetes.io/part-of: platform-sandbox
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cost-reporter
  namespace: sample-app
  labels:
    app.kubernetes.io/name: cost-reporter
    app.kubernetes.io/part-of: platform-sandbox
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cost-reporter
  namespace: sample-app
  labels:
    app.kubernetes.io/name: cost-reporter
    app.kubernetes.io/part-of: platform-sandbox
subjects:
  - kind: ServiceAccount
    name: cost-reporter
    namespace: sample-app
roleRef:
  kind: Role
  name: cost-reporter
  apiGroup: rbac.authorization.k8s.io