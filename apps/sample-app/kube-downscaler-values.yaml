# Helm values for kube-downscaler
# This manages the automatic scaling of workloads to save costs.

replicaCount: 1

image:
  repository: hjacobs/kube-downscaler
  tag: "23.2.0"
  pullPolicy: IfNotPresent

# Merged Configuration
extraConfig:
  DEFAULT_TIMEZONE: "UTC"
  # You can add more ENV vars here later (e.g., DRY_RUN: "true")

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

rbac:
  create: true

serviceAccount:
  create: true
  name: kube-downscaler

service:
  enabled: true
  port: 80